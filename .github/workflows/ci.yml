# Runs the typecheck, the tests, the module-boundary check, and the nukadoko
# scenario on every push to main and queue, on pull requests, and on demand.
name: CI

on:
  push:
    branches: [main, queue]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run archstrict
      - run: npm run build
      - name: Run the nukadoko scenario against the built CLI
        run: npm run test:scenarios
